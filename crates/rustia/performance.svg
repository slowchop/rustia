<svg xmlns="http://www.w3.org/2000/svg" width="860" height="471" viewBox="0 0 860 471" style="max-width:100%;height:auto" role="img" aria-labelledby="rustia-perf-title rustia-perf-desc">
<title id="rustia-perf-title">Time per work unit in microseconds</title>
<desc id="rustia-perf-desc">ci-bench · Linux x86-64 · 2026-10-22 UTC · 9b12a5a. Best observed steady-state times, lower is better. Workloads in order: Build, sum, and sort a 256-item array, Fill and read 128 hash entries, One closure call updating a captured value, Custom, keyed, and array iteration pass, Math library calls and buffered appends. Roto searches a list for sparse lookups and calls a regular function for the state update. Rustia, Interpreter: 51.657, 87.555, 0.197, 14.035, 1.421. luaur, Interpreter: 18.395, 20.192, 0.053, 3.162, 0.197. ruau, Interpreter: 72.827, 88.879, 0.307, 17.020, 1.320. Luau (C++) via mlua, Interpreter: 18.919, 22.485, 0.051, 4.170, 0.237. Luau (C++) via mlua, JIT: 18.924, 18.745, 0.022, 3.346, 0.237. Koto, Interpreter: 262.217, 146.082, 0.346, 7.391, 1.536. Rhai, Interpreter: 313.191, 348.085, 1.478, 9.566, 3.174. Roto, Native compiled: 3,329.076, 147.728, 0.009, 3.252, 0.280.</desc>
