[package]
name = "rustia-live-wasm"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
rustia = { path = "../../../crates/rustia" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

