name: Publish Benchmark Data

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-benchmark-data.yml
      - bench/CLAIMS.md
      - bench/RESULTS.md
      - bench/current-results.html
      - bench/current-results.json
      - bench/grabby-builds/**
      - bench/history/runs.jsonl
      - bench/history/backfills/**
      - bench/operations-policy.json
      - bench/operations-status.json
      - bench/render-claims.js
      - bench/render-current-results.js
      - bench/wasm-gate.json
      - bench/wasm/current-results.json
      - bench/wasm/dispatch-current-results.json
      - tools/check-benchmark-results.js
      - tools/check-grabby-build-results.js
      - tools/check-wasm-gate-results.js
      - tools/render-benchmark-data-readme.js
      - tools/render-benchmark-operations-status.js
  workflow_dispatch:
  workflow_call:
    secrets:
      BENCH_DATA_DEPLOY_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: rustia-benchmark-data-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish accepted artifacts
    if: github.ref == 'refs/heads/main'
    runs-on:
      group: general-linux
      labels: [self-hosted, Linux, X64, general-linux]
    timeout-minutes: 20

    steps:
      - name: Checkout trusted main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.95.0
          cache: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Validate committed benchmark artifacts
        run: |
          node tools/check-benchmark-results.js
          node tools/check-wasm-gate-results.js
          node tools/render-benchmark-operations-status.js --check
          node tools/check-current-report-summary.js
          node tools/check-grabby-build-results.js
          node bench/render-current-results.js --check
          node bench/render-claims.js --check

      - name: Publish data repository and Pages
        env:
          BENCH_DATA_DEPLOY_KEY: ${{ secrets.BENCH_DATA_DEPLOY_KEY }}
        run: |
          test -n "$BENCH_DATA_DEPLOY_KEY"
          source_commit="$(git rev-parse HEAD)"
          publish_dir="$(mktemp -d "$RUNNER_TEMP/rustia-bench-publish.XXXXXX")"
          ssh_dir="$publish_dir/ssh"
          data_dir="$publish_dir/data"
          pages_dir="$publish_dir/pages"
          cleanup() {
            rm -rf -- "$publish_dir"
          }
          trap cleanup EXIT
          install -d -m 700 "$ssh_dir"
          install -m 600 /dev/null "$ssh_dir/id_ed25519"
          printf '%s\n' "$BENCH_DATA_DEPLOY_KEY" > "$ssh_dir/id_ed25519"
          unset BENCH_DATA_DEPLOY_KEY
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$ssh_dir/known_hosts"

          git clone --branch main git@github.com:slowchop/rustia-bench-data.git "$data_dir"
          install -d "$data_dir/bench/history" "$data_dir/bench/wasm" "$data_dir/bench/grabby-builds"
          for artifact in \
            bench/CLAIMS.md \
            bench/RESULTS.md \
            bench/current-results.json \
            bench/grabby-builds/results.json \
            bench/history/runs.jsonl \
            bench/operations-status.json \
            bench/wasm-gate.json \
            bench/wasm/current-results.json \
            bench/wasm/dispatch-current-results.json; do
            install -m 644 "$artifact" "$data_dir/$artifact"
          done

          # The reconstructed-history artifacts, mirrored so a reader can check
          # the published chart against the rows behind it. The data repo
          # previously carried the picture of the 75-revision series without its
          # 375 rows, while the cross-engine matrix beside it was fully mirrored.
          # Evidence stays in the source repo: it is large, and the artifact is
          # what is needed to verify a number on the page.
          rm -rf -- "$data_dir/bench/history/backfills"
          install -d "$data_dir/bench/history/backfills"
          for backfill in bench/history/backfills/*.json; do
            [ -e "$backfill" ] || continue
            install -m 644 "$backfill" "$data_dir/$backfill"
          done

          # The live per-commit series is validated where its rows live. The
          # protocol is in this repository and reviewed; the rows are in the
          # data repository because they grow with every commit.
          node tools/check-benchmark-series.js --rows-root "$data_dir"

          # The live series rows, brought into the checkout so the chart can
          # draw them. Validating them was not enough: the renderer reads the
          # rows from this tree, so without this the published chart stops at
          # the last reconstructed revision no matter how many commits have
          # been measured since.
          if [ -f "$data_dir/bench/history/series/ci-bench-main.jsonl" ]; then
            install -d bench/history/series
            install -m 644 "$data_dir/bench/history/series/ci-bench-main.jsonl" \
              bench/history/series/ci-bench-main.jsonl
          fi

          install -m 644 "$data_dir/bench/memory/current-results.json" bench/memory/current-results.json
          install -m 644 "$data_dir/bench/memory/history/runs.jsonl" bench/memory/history/runs.jsonl
          node bench/render-current-results.js
          install -m 644 bench/current-results.html "$data_dir/bench/current-results.html"
          node tools/render-benchmark-data-readme.js \
            --source "$data_dir/bench/current-results.json" \
            --history "$data_dir/bench/history/runs.jsonl" \
            --wasm-source "$data_dir/bench/wasm/current-results.json" \
            --output "$data_dir/README.md"

          git -C "$data_dir" config user.name "rustia-benchmark"
          git -C "$data_dir" config user.email "benchmark@rustia.invalid"
          git -C "$data_dir" add README.md bench
          if ! git -C "$data_dir" diff --cached --quiet; then
            git -C "$data_dir" commit -m "Publish benchmark data ${source_commit:0:12}"
            node tools/push-benchmark-data-publication.js --repo-dir "$data_dir" --kind artifacts
          fi

          git -C "$data_dir" fetch origin gh-pages
          git -C "$data_dir" worktree add --detach "$pages_dir" origin/gh-pages
          install -m 644 bench/current-results.html "$pages_dir/index.html"
          install -m 644 bench/grabby-builds/results.json "$pages_dir/grabby-builds.json"
          git -C "$pages_dir" config user.name "rustia-benchmark"
          git -C "$pages_dir" config user.email "benchmark@rustia.invalid"
          git -C "$pages_dir" add index.html grabby-builds.json
          if ! git -C "$pages_dir" diff --cached --quiet; then
            git -C "$pages_dir" commit -m "Publish benchmark data ${source_commit:0:12}"
            git -C "$pages_dir" push origin HEAD:gh-pages
          fi
