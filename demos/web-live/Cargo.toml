[package]
name = "rustia-web-live-example"
version = "0.0.1"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "race-native"
path = "race-native.rs"

[dependencies]
# Keep Rustia's default platform-adapters feature: this application uses JavaScript services.
rustia = { path = "../../crates/rustia" }
wasm-bindgen = "=0.2.126"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
