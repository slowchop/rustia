[package]
name = "spike-sk-rustia"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
libm = "0.2"
rand_chacha = "0.3"
rand_core = "0.6"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "skbench"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
