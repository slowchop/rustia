[package]
name = "rustia-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
mlua = { version = "=0.11.6", default-features = false, features = ["luau"], optional = true }
luau0-src = { version = "=0.18.3", optional = true }
rustia = { path = "../crates/rustia", default-features = false }
libfuzzer-sys = "0.4.13"
rustia-compiler = { path = "../crates/rustia-compiler" }
rustia-lexer = { path = "../crates/rustia-lexer" }
rustia-parser = { path = "../crates/rustia-parser" }
rustia-vm = { path = "../crates/rustia-vm" }

[[bin]]
name = "lexer"
path = "fuzz_targets/lexer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compiler"
path = "fuzz_targets/compiler.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vm"
path = "fuzz_targets/vm.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[features]
oracle = ["dep:mlua", "dep:luau0-src"]

[[bin]]
name = "error-oracle-worker"
path = "src/bin/error_oracle_worker.rs"
required-features = ["oracle"]
test = false
doc = false
bench = false

[[bin]]
name = "stateful"
path = "fuzz_targets/stateful.rs"
test = false
doc = false
bench = false

[[bin]]
name = "differential"
path = "fuzz_targets/differential.rs"
test = false
doc = false
bench = false
