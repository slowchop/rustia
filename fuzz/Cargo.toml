[package]
name = "rustia-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
rustia-compiler = { path = "../crates/rustia-compiler" }
rustia-lexer = { path = "../crates/rustia-lexer" }
rustia-parser = { path = "../crates/rustia-parser" }
rustia-vm = { path = "../crates/rustia-vm" }

[[bin]]
name = "lexer"
path = "fuzz_targets/lexer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compiler"
path = "fuzz_targets/compiler.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vm"
path = "fuzz_targets/vm.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

