name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt

      - name: Use pinned Rust toolchain
        run: rustup default 1.95.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          node --version

      - name: Run canonical release preflight
        run: node tools/run-release-preflight.js

  portable-engine-build:
    name: Engine build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
          - aarch64-apple-ios
          - aarch64-linux-android
          - wasm32-unknown-unknown

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain and target
        run: rustup toolchain install 1.95.0 --profile minimal --target ${{ matrix.target }}

      - name: Check portable engine library
        run: cargo check --locked -p rustia --lib --target ${{ matrix.target }}

  wasm-node-runtime:
    name: Wasm runtime (Node/V8)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain and wasm target
        run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install matching wasm-bindgen test runner
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Run bare wasm host-adapter tests
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test --locked -p rustia --target wasm32-unknown-unknown --no-default-features --test bare_wasm_live

      - name: Run default web-live adapter tests on Node/V8
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test --locked -p rustia --target wasm32-unknown-unknown --test web_live
