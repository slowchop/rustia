name: Rustia Bulk
run-name: rustia-ci:${{ inputs.repository_id }}:${{ inputs.attempt_id }}:${{ inputs.checkout_sha }}:${{ inputs.manifest_digest }}

"on":
  workflow_dispatch:
    inputs:
      repository_id:
        description: Numeric repository identity bound by the controller
        type: string
        required: true
      attempt_id:
        description: Numeric controller attempt identity
        type: string
        required: true
      checkout_sha:
        description: Exact candidate commit to check out
        type: string
        required: true
      manifest_digest:
        description: SHA-256 digest of the canonical attempt manifest
        type: string
        required: true

permissions:
  contents: read

jobs:
  integrity:
    name: integrity
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate dispatch inputs
        shell: bash
        env:
          REPOSITORY_ID: ${{ inputs.repository_id }}
          ATTEMPT_ID: ${{ inputs.attempt_id }}
          CHECKOUT_SHA: ${{ inputs.checkout_sha }}
          MANIFEST_DIGEST: ${{ inputs.manifest_digest }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ATTEMPT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CHECKOUT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MANIFEST_DIGEST" =~ ^[0-9a-f]{64}$ ]]

      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_CHECKOUT_SHA: ${{ inputs.checkout_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CHECKOUT_SHA"

  validation:
    name: validation
    needs: integrity
    if: github.ref == 'refs/heads/main' && needs.integrity.result == 'success'
    uses: ./.github/workflows/staged-correctness.yml
    with:
      checkout_sha: ${{ inputs.checkout_sha }}
