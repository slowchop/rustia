[package]
name = "spike-h-slice"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
gc-arena = "0.6.0"
libm = "0.2"
serde = { version = "1", features = ["derive"] }

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "hbench"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# NOTE: not panic=abort here — gc-arena's mutate uses catch-free paths but serde Deserialize
# returns Result so we keep unwinding off the hot path via Result, not panics.
