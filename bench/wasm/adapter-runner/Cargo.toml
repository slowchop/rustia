[package]
name = "script-bench-wasm-adapter"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
koto = { version = "0.16", default-features = false, features = ["arc"] }
rustia = { path = "../../../crates/rustia" }
wasmi = "2.0.0-beta.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
