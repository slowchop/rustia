name: CI

# Correctness uses private self-hosted pools with read-only repository access.
# Public repositories and fork PRs cannot use these persistent runners. Manual
# dispatch runs Windows/Firefox; Safari requires the explicit safari input.
"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      safari:
        description: Run visible Safari tests on an existing logged-in runner desktop
        type: boolean
        default: false
      safari_version:
        description: Exact installed Safari version required by the explicit Safari run
        type: string
        default: "26.6.2"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-preflight:
    name: Preflight (${{ matrix.stage }})
    strategy:
      fail-fast: false
      matrix:
        stage: [quick, workspace, release]
    if: github.event.repository.private == true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on:
      group: general-linux
      labels: [self-hosted, Linux, X64, general-linux]
    # Keep all coverage while independent stages use separate runner checkouts.
    # The required aggregate below rejects any failed, cancelled or skipped stage.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The wasm target is for the benchmark adapter's Clippy in preflight. The
      # action pins the toolchain with `rustup override`, which bypasses the
      # target list in rust-toolchain.toml, so it has to be named here.
      - name: Install pinned Rust toolchain and wasm target
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.95.0
          target: wasm32-unknown-unknown
          components: clippy, rustfmt
          cache: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          node --version

      - name: Run canonical release preflight
        run: node tools/run-release-preflight.js --stage "${{ matrix.stage }}"

      - name: Execute Linux golden on x86-64
        if: matrix.stage == 'workspace'
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          git rev-parse HEAD
          bash tools/run-private-platform-golden.sh native default x86_64-unknown-linux-gnu
          bash tools/run-private-platform-golden.sh native bare x86_64-unknown-linux-gnu

      - name: Check feature-gated executor accounting paths
        if: matrix.stage == 'workspace'
        run: |
          cargo clippy --locked -p rustia-compiler --all-targets --features executor-diagnostics -- -D warnings
          cargo test --locked --release -p rustia-compiler --features executor-diagnostics --test gc_accounting_paths -- --nocapture

  release-gate:
    name: Release preflight
    needs: [release-preflight, webkit-runtime]
    if: always() && github.event.repository.private == true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on:
      group: general-linux
      labels: [self-hosted, Linux, X64, general-linux]
    steps:
      - name: Require every preflight stage
        env:
          PREFLIGHT_RESULT: ${{ needs.release-preflight.result }}
          WEBKIT_RESULT: ${{ needs.webkit-runtime.result }}
        run: test "$PREFLIGHT_RESULT" = success && test "$WEBKIT_RESULT" = success

  macos-arm64-runtime:
    name: Native runtime (macOS arm64)
    if: github.event.repository.private == true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on:
      group: general-macos
      labels: [self-hosted, macOS, ARM64, general-macos]
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      RUSTFLAGS: -D warnings

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          if [ ! -x "$cargo_bin/rustup" ]; then
            echo "::error::Rustup is missing from this account's Cargo tools directory."
            exit 1
          fi
          export PATH="$cargo_bin:$PATH"
          echo "$cargo_bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.95.0 --profile minimal --target aarch64-apple-darwin --no-self-update

      - name: Verify native arm64 execution and run shared correctness suites
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test "$(rustc -vV | sed -n 's/^host: //p')" = aarch64-apple-darwin
          git rev-parse HEAD
          bash tools/run-private-platform-golden.sh native default aarch64-apple-darwin
          bash tools/run-private-platform-golden.sh native bare aarch64-apple-darwin
          cargo test --locked -p rustia --target aarch64-apple-darwin --test host_functions --test typed_objects --test live_value_contract --test module_resolution --test yieldable_require --test callable_continuations --test numeric_index_contract --test type_grammar
          cargo test --locked -p rustia --target aarch64-apple-darwin --no-default-features --test host_functions --test typed_objects --test live_value_contract --test module_resolution --test yieldable_require --test callable_continuations --test numeric_index_contract --test type_grammar

  portable-engine-build:
    name: Engine build (${{ matrix.target }})
    if: github.event.repository.private == true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on:
      group: general-linux
      labels: [self-hosted, Linux, X64, general-linux]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
          - aarch64-apple-ios
          - aarch64-linux-android
          - wasm32-unknown-unknown

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and target
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.95.0
          target: ${{ matrix.target }}
          cache: false

      - name: Check portable engine library
        run: cargo check --locked -p rustia --lib --target ${{ matrix.target }}

  wasm-node-runtime:
    name: Wasm runtime (Node/V8)
    if: github.event.repository.private == true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on:
      group: general-linux
      labels: [self-hosted, Linux, X64, general-linux]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and wasm target
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.95.0
          target: wasm32-unknown-unknown
          cache: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # The shared pool keeps ~/.cargo/bin between jobs, so a bare `cargo
      # install` fails as soon as the binary is already there -- which is what
      # broke this job the first time it was not cancelled by a newer push.
      # Assert the pin instead of installing blind: reinstall when the runner
      # has no wasm-bindgen or the wrong one, and skip when it already matches.
      # If the version string ever stops matching this shape the check simply
      # reinstalls every run, which is slower but never wrong.
      - name: Install matching wasm-bindgen test runner
        run: |
          set -euo pipefail
          if [ "$(wasm-bindgen --version 2>/dev/null || true)" != "wasm-bindgen 0.2.126" ]; then
            cargo install wasm-bindgen-cli --version 0.2.126 --locked --force
          fi
          wasm-bindgen --version

      - name: Run bare wasm host-adapter tests
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: |
          cargo test --locked -p rustia --target wasm32-unknown-unknown --no-default-features --test bare_wasm_live
          cargo test --locked -p rustia --target wasm32-unknown-unknown --no-default-features --test mixed_heap_pressure
          cargo test --locked -p rustia --target wasm32-unknown-unknown --no-default-features --lib engine_boundary_tests::mixed_heap_pressure_preserves_the_short_collection_cadence
          cargo test --locked -p rustia --target wasm32-unknown-unknown --no-default-features --test host_functions
          cargo test --locked -p rustia --target wasm32-unknown-unknown --no-default-features --test typed_objects
          cargo test --locked -p rustia --target wasm32-unknown-unknown --no-default-features --test live_value_contract
          cargo test --locked -p rustia --target wasm32-unknown-unknown --no-default-features --test yieldable_require --test callable_continuations --test numeric_index_contract --test type_grammar
          bash tools/run-private-platform-golden.sh wasm bare

      - name: Run default web-live adapter tests on Node/V8
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: |
          cargo test --locked -p rustia --target wasm32-unknown-unknown --test web_live
          cargo test --locked -p rustia --target wasm32-unknown-unknown --test host_functions
          cargo test --locked -p rustia --target wasm32-unknown-unknown --test typed_objects
          cargo test --locked -p rustia --target wasm32-unknown-unknown --test live_value_contract
          cargo test --locked -p rustia --target wasm32-unknown-unknown --test yieldable_require --test callable_continuations --test numeric_index_contract --test type_grammar
          bash tools/run-private-platform-golden.sh wasm default

  windows-runtime:
    if: github.event.repository.private == true && github.event_name == 'workflow_dispatch'
    name: Native runtime (Windows x86-64)
    runs-on:
      group: general-windows
      labels: [self-hosted, Windows, X64, general-windows]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and verify native host
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') { throw 'Expected native Windows x86-64' }
          # Keep the job independent of shared Rust shims and installations.
          $toolRoot = Join-Path $env:RUNNER_TEMP 'rustia-windows-toolchain'
          $env:CARGO_HOME = Join-Path $toolRoot 'cargo'
          $env:RUSTUP_HOME = Join-Path $toolRoot 'rustup'
          New-Item -ItemType Directory -Force -Path $toolRoot | Out-Null
          $installer = Join-Path $toolRoot 'rustup-init.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-pc-windows-msvc/rustup-init.exe' -OutFile $installer
          $expected = '88d8258dcf6ae4f7a80c7d1088e1f36fa7025a1cfd1343731b4ee6f385121fc0'
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Rust installer checksum mismatch' }
          & $installer -y --no-modify-path --profile minimal --default-host x86_64-pc-windows-msvc --default-toolchain 1.95.0
          if ($LASTEXITCODE -ne 0) { throw "Pinned Rust installation failed with exit code $LASTEXITCODE" }
          $cargoBin = Join-Path $env:CARGO_HOME 'bin'
          $env:PATH = "$cargoBin;$env:PATH"
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CARGO_HOME=$env:CARGO_HOME" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RUSTUP_HOME=$env:RUSTUP_HOME" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $version = & (Join-Path $cargoBin 'rustc.exe') -vV
          if ($LASTEXITCODE -ne 0 -or $version -notcontains 'host: x86_64-pc-windows-msvc') { throw 'Rust compiler host does not match Windows x86-64' }
      - name: Execute native correctness contracts
        run: |
          set -euo pipefail
          for mode in default bare; do
            bash tools/run-private-platform-golden.sh native "$mode" x86_64-pc-windows-msvc
            features=()
            if [ "$mode" = bare ]; then features+=(--no-default-features); fi
            cargo test --locked -p rustia --target x86_64-pc-windows-msvc "${features[@]}" \
              --test host_functions --test typed_objects --test live_value_contract \
              --test module_resolution --test yieldable_require \
              --test callable_continuations --test numeric_index_contract --test type_grammar
          done

  webkit-runtime:
    name: Browser runtime (headless WebKit)
    if: github.event.repository.private == true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on:
      group: general-linux
      labels: [self-hosted, Linux, X64, general-linux, docker]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - name: Install Rust build dependencies
        run: apt-get update && apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.95.0
          target: wasm32-unknown-unknown
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install pinned Wasm and browser tools
        run: |
          set -euo pipefail
          cargo install wasm-bindgen-cli --version 0.2.126 --locked
          npm ci --prefix tools/browser --ignore-scripts
      - name: Execute both feature modes in headless WebKit
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash tools/run-browser-correctness.sh webkit 1.64.1
      - name: Execute documented browser embedding example
        run: |
          cargo build --locked --manifest-path demos/web-live/Cargo.toml --target wasm32-unknown-unknown --release --target-dir demos/web-live/target
          wasm-bindgen --target web --out-dir demos/web-live/pkg --out-name rustia_example demos/web-live/target/wasm32-unknown-unknown/release/rustia_web_live_example.wasm
          node tools/browser/web-live-example.cjs
      - name: Record the native and WebKit race
        env:
          CARGO_TARGET_DIR: demos/web-live/target
        run: |
          apt-get install -y --no-install-recommends ffmpeg
          node tools/browser/record-race.cjs target/demo/rustia-replay.mp4
          node tools/browser/record-race.cjs --hot-reload target/demo/rustia-hot-reload.mp4
      - name: Save the race recording
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rustia-replay
          path: |
            target/demo/rustia-replay.mp4
            target/demo/rustia-hot-reload.mp4
          if-no-files-found: error
          retention-days: 7

  firefox-runtime:
    name: Browser runtime (real Firefox, manual)
    if: github.event.repository.private == true && github.event_name == 'workflow_dispatch'
    runs-on:
      group: general-linux
      labels: [self-hosted, Linux, X64, general-linux, docker]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - name: Install container build and Firefox dependencies
        run: apt-get update && apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev python3 libdbus-glib-1-2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.95.0
          target: wasm32-unknown-unknown
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install pinned Wasm tools and official Firefox
        run: |
          set -euo pipefail
          cargo install wasm-bindgen-cli --version 0.2.126 --locked
          browser_tools=$(mktemp -d "$RUNNER_TEMP/rustia-firefox.XXXXXX")
          mkdir "$browser_tools/bin"
          curl --fail --location --silent --show-error https://archive.mozilla.org/pub/firefox/releases/160.0/linux-x86_64/en-US/firefox-160.0.tar.xz --output "$browser_tools/firefox.tar.xz"
          printf '%s  %s\n' e9c7ed0d4abc6eb3648c2c5652bd325e690423ef49414ef201eac59c0932ea8ec52260cf652510b2c98971c7e7eb36e6be8101d87cae17c6dd28ed763bac32a6 "$browser_tools/firefox.tar.xz" | sha512sum --check --status
          tar -xJf "$browser_tools/firefox.tar.xz" -C "$browser_tools"
          curl --fail --location --silent --show-error https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz --output "$browser_tools/geckodriver.tar.gz"
          printf '%s  %s\n' e815130ea95983e162ae91843b48d3a3ce991735635fce83a647afde21e09f7e "$browser_tools/geckodriver.tar.gz" | sha256sum --check --status
          tar -xzf "$browser_tools/geckodriver.tar.gz" -C "$browser_tools/bin" geckodriver
          browser_home="$browser_tools/firefox-home"
          mkdir "$browser_home"
          # Scope the owned browser home to Firefox; keep Cargo/Git/Rustup homes intact.
          {
            printf '%s\n' '#!/usr/bin/env bash'
            printf 'exec env -u XAUTHORITY -u XDG_RUNTIME_DIR HOME=%q %q "$@"\n' "$browser_home" "$browser_tools/firefox/firefox"
          } > "$browser_tools/bin/firefox"
          chmod 755 "$browser_tools/bin/firefox"
          echo "$browser_tools/bin" >> "$GITHUB_PATH"
      - name: Execute both feature modes in real Firefox
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash tools/run-browser-correctness.sh firefox 160.0 0.37.1

  safari-runtime:
    name: Browser runtime (real Safari, explicit manual)
    if: github.event.repository.private == true && github.event_name == 'workflow_dispatch' && inputs.safari
    runs-on:
      group: general-macos
      labels: [self-hosted, macOS, ARM64, general-macos]
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      SAFARI_VERSION: ${{ inputs.safari_version }}
    steps:
      - name: Verify existing logged-in Safari desktop
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          runner_owns_console=false
          if [ "$(stat -f '%Su' /dev/console)" = "$(id -un)" ]; then
            runner_owns_console=true
          fi
          runner_gui_available=false
          if launchctl print "gui/$(id -u)" >/dev/null 2>&1; then
            runner_gui_available=true
          fi
          printf 'Safari readiness: runnerOwnsConsole=%s; runnerGuiDomainExists=%s\n' "$runner_owns_console" "$runner_gui_available"
          if [ "$runner_owns_console" != true ] || [ "$runner_gui_available" != true ]; then
            echo "::error::Safari needs the runner account's existing logged-in desktop session; no browser tests ran."
            exit 1
          fi
          actual_safari=$(defaults read /Applications/Safari.app/Contents/Info CFBundleShortVersionString)
          printf 'Installed Safari: %s; expected: %s\n' "$actual_safari" "$SAFARI_VERSION"
          test -n "$SAFARI_VERSION"
          test "$actual_safari" = "$SAFARI_VERSION"
          /usr/bin/safaridriver --version
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and temporary Wasm tools
        run: |
          set -euo pipefail
          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          if [ ! -x "$cargo_bin/rustup" ]; then
            echo "::error::Rustup is missing from this account's Cargo tools directory."
            exit 1
          fi
          export PATH="$cargo_bin:$PATH"
          echo "$cargo_bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown --no-self-update
          safari_tools=$(mktemp -d "$RUNNER_TEMP/rustia-safari.XXXXXX")
          curl --fail --location --silent --show-error https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.126/wasm-bindgen-0.2.126-aarch64-apple-darwin.tar.gz --output "$safari_tools/wasm-tools.tar.gz"
          printf '%s  %s\n' 7df536babe345deb68828148dbdc71179118afdab42d83547c7cebfbf1426bd5 "$safari_tools/wasm-tools.tar.gz" | shasum -a 256 --check --status
          tar -xzf "$safari_tools/wasm-tools.tar.gz" -C "$safari_tools"
          echo "$safari_tools/wasm-bindgen-0.2.126-aarch64-apple-darwin" >> "$GITHUB_PATH"
      - name: Execute both feature modes in real Safari
        run: |
          set -euo pipefail
          git rev-parse HEAD
          bash tools/run-browser-correctness.sh safari "$SAFARI_VERSION"
