name: Rustia Quick trust fixture
run-name: rustia-quick:${{ inputs.repository_id }}:${{ inputs.admission_id }}:${{ inputs.checkout_sha }}:${{ inputs.quick_intent_digest }}

"on":
  workflow_dispatch:
    inputs:
      repository_id:
        description: Numeric target repository identity bound by the controller
        type: string
        required: true
      admission_id:
        description: Canonical controller admission identity
        type: string
        required: true
      pull_request:
        description: Numeric source pull-request identity
        type: string
        required: true
      head_repository_id:
        description: Numeric source repository identity
        type: string
        required: true
      head_repository_full_name:
        description: Source owner and repository used for the exact checkout
        type: string
        required: true
      checkout_sha:
        description: Exact source commit to check out
        type: string
        required: true
      quick_intent_digest:
        description: SHA-256 digest of the canonical Quick intent
        type: string
        required: true

permissions:
  contents: read

jobs:
  integrity:
    name: integrity
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate dispatch inputs
        shell: bash
        env:
          REPOSITORY_ID: ${{ inputs.repository_id }}
          ADMISSION_ID: ${{ inputs.admission_id }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          HEAD_REPOSITORY_ID: ${{ inputs.head_repository_id }}
          HEAD_REPOSITORY_FULL_NAME: ${{ inputs.head_repository_full_name }}
          CHECKOUT_SHA: ${{ inputs.checkout_sha }}
          QUICK_INTENT_DIGEST: ${{ inputs.quick_intent_digest }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ADMISSION_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          [[ "$PULL_REQUEST" =~ ^[1-9][0-9]*$ ]]
          [[ "$HEAD_REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$HEAD_REPOSITORY_FULL_NAME" =~ ^[^/[:space:][:cntrl:]]+/[^/[:space:][:cntrl:]]+$ ]]
          owner=${HEAD_REPOSITORY_FULL_NAME%%/*}
          repository=${HEAD_REPOSITORY_FULL_NAME#*/}
          (( ${#owner} <= 255 && ${#repository} <= 255 ))
          [[ "$CHECKOUT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$QUICK_INTENT_DIGEST" =~ ^[0-9a-f]{64}$ ]]

      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.head_repository_full_name }}
          ref: ${{ inputs.checkout_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_CHECKOUT_SHA: ${{ inputs.checkout_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CHECKOUT_SHA"

  test:
    name: test
    needs: integrity
    if: github.ref == 'refs/heads/main' && needs.integrity.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout protected policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.head_repository_full_name }}
          ref: ${{ inputs.checkout_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Verify test checkout
        shell: bash
        working-directory: candidate
        env:
          EXPECTED_CHECKOUT_SHA: ${{ inputs.checkout_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CHECKOUT_SHA"

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.95.0
          components: rustfmt
          cache: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Run protected Quick policy
        working-directory: candidate
        env:
          RUSTIA_PREFLIGHT_ROOT: ${{ github.workspace }}/candidate
        run: node ../trusted/tools/run-release-preflight.js --stage quick
