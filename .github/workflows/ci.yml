name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal

      - name: Use Rust stable
        run: rustup default stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          node --version

      - name: Check release notes
        run: node tools/check-release-notes.js

      - name: Check package file audit
        run: node tools/check-package-files.js --check

      - name: Check publishability audit
        run: node tools/check-publishability.js --check

      - name: Check progress dashboard
        run: node design/render-progress.js --check

      - name: Check benchmark generated artifacts
        run: |
          node tools/check-benchmark-results.js
          node bench/render-current-results.js --check
          node bench/render-claims.js --check

      - name: Run workspace tests
        run: cargo test --workspace
