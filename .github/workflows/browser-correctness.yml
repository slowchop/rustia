name: Browser correctness acceptance

# Manual until installed browser versions and Safari automation are verified.
"on":
  workflow_dispatch:
    inputs:
      firefox-version:
        description: Exact preinstalled Firefox version
        required: true
        type: string
      geckodriver-version:
        description: Exact preinstalled geckodriver version
        required: true
        type: string
      safari-version:
        description: Exact preinstalled Safari version
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: browser-correctness-${{ github.ref }}
  cancel-in-progress: false
jobs:
  firefox-runtime:
    name: Browser runtime (Firefox)
    runs-on:
      group: general-linux
      labels: [self-hosted, Linux, X64, general-linux]
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      RUSTFLAGS: -D warnings
      EXPECTED_BROWSER: ${{ inputs.firefox-version }}
      EXPECTED_DRIVER: ${{ inputs.geckodriver-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and Wasm runner
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown --no-self-update
          if [ "$(wasm-bindgen --version 2>/dev/null || true)" != "wasm-bindgen 0.2.126" ]; then
            cargo install wasm-bindgen-cli --version 0.2.126 --locked --force
          fi
      - name: Verify actual Firefox correctness
        run: bash tools/run-browser-correctness.sh firefox "$EXPECTED_BROWSER" "$EXPECTED_DRIVER"
  safari-runtime:
    name: Browser runtime (Safari)
    runs-on:
      group: general-macos
      labels: [self-hosted, macOS, ARM64, general-macos]
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      RUSTFLAGS: -D warnings
      EXPECTED_BROWSER: ${{ inputs.safari-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and Wasm runner
        run: |
          set -euo pipefail
          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          test -x "$cargo_bin/rustup"
          export PATH="$cargo_bin:$PATH"
          echo "$cargo_bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown --no-self-update
          if [ "$(wasm-bindgen --version 2>/dev/null || true)" != "wasm-bindgen 0.2.126" ]; then
            cargo install wasm-bindgen-cli --version 0.2.126 --locked --force
          fi
      - name: Verify actual Safari correctness
        run: bash tools/run-browser-correctness.sh safari "$EXPECTED_BROWSER"
