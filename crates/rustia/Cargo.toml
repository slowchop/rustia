[package]
name = "rustia"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# project-copy: intro
description = "Rustia is a pure-Rust interpreter for embedding standalone Luau in games and tools. Edit scripts without a rebuild and let players write mods.\n\nWe built Rustia at Slowchop Studios for a Bevy game. We wanted to tweak gameplay without waiting for Rust to recompile, run scripts quickly and safely, and get deterministic results for multiplayer and replays on desktop and in the browser."
# /project-copy: intro
publish.workspace = true

[features]
default = ["platform-adapters"]
platform-adapters = ["dep:getrandom", "dep:js-sys", "dep:wasm-bindgen", "getrandom/wasm_js"]
send = ["rustia-vm/send"]

[dependencies]
getrandom = { version = "0.3.4", optional = true }
rustia-compiler.workspace = true
rustia-lexer.workspace = true
rustia-parser.workspace = true
rustia-vm.workspace = true
serde.workspace = true
serde_path_to_error.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"

[[example]]
name = "transferable"
required-features = ["send"]

[lints]
workspace = true
