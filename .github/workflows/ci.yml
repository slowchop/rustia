name: CI

# workflow_dispatch is how main's tip gets CI after the weekly matrix lands a
# cohort: that merge is made with the workflow token, which starts no push
# workflows, so the matrix workflow dispatches this one on main instead. A
# dispatched run on main shares the push runs' concurrency group below, so the
# newest run wins, as it does between two quick merges. A manual trigger is
# harmless only because this workflow holds a read-only token and no secret.
"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-preflight:
    name: Preflight (${{ matrix.stage }})
    strategy:
      fail-fast: false
      matrix:
        stage: [quick, workspace, release]
    runs-on:
      group: general-linux
      labels: [self-hosted, Linux, X64, general-linux]
    # Keep all coverage while independent stages use separate runner checkouts.
    # The required aggregate below rejects any failed, cancelled or skipped stage.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The wasm target is for the benchmark adapter's Clippy in preflight. The
      # action pins the toolchain with `rustup override`, which bypasses the
      # target list in rust-toolchain.toml, so it has to be named here.
      - name: Install pinned Rust toolchain and wasm target
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.95.0
          target: wasm32-unknown-unknown
          components: clippy, rustfmt
          cache: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          node --version

      - name: Run canonical release preflight
        run: node tools/run-release-preflight.js --stage "${{ matrix.stage }}"

      - name: Execute shared private golden on Linux x86-64
        if: matrix.stage == 'workspace'
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          git rev-parse HEAD
          bash tools/run-private-platform-golden.sh native default x86_64-unknown-linux-gnu
          bash tools/run-private-platform-golden.sh native bare x86_64-unknown-linux-gnu

  release-gate:
    name: Release preflight
    needs: release-preflight
    if: always()
    runs-on:
      group: general-linux
      labels: [self-hosted, Linux, X64, general-linux]
    steps:
      - name: Require every preflight stage
        env:
          PREFLIGHT_RESULT: ${{ needs.release-preflight.result }}
        run: test "$PREFLIGHT_RESULT" = success

  macos-arm64-runtime:
    name: Native runtime (macOS arm64)
    runs-on:
      group: general-macos
      labels: [self-hosted, macOS, ARM64, general-macos]
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      RUSTFLAGS: -D warnings

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          if [ ! -x "$cargo_bin/rustup" ]; then
            echo "::error::Rustup is missing from this account's Cargo tools directory."
            exit 1
          fi
          export PATH="$cargo_bin:$PATH"
          echo "$cargo_bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.95.0 --profile minimal --target aarch64-apple-darwin --no-self-update

      - name: Verify native arm64 execution and run shared correctness suites
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test "$(rustc -vV | sed -n 's/^host: //p')" = aarch64-apple-darwin
          git rev-parse HEAD
          bash tools/run-private-platform-golden.sh native default aarch64-apple-darwin
          bash tools/run-private-platform-golden.sh native bare aarch64-apple-darwin
          cargo test --locked -p rustia --target aarch64-apple-darwin --test host_functions --test typed_objects --test live_value_contract --test module_resolution --test yieldable_require --test callable_continuations --test numeric_index_contract
          cargo test --locked -p rustia --target aarch64-apple-darwin --no-default-features --test host_functions --test typed_objects --test live_value_contract --test module_resolution --test yieldable_require --test callable_continuations --test numeric_index_contract

  portable-engine-build:
    name: Engine build (${{ matrix.target }})
    runs-on:
      group: general-linux
      labels: [self-hosted, Linux, X64, general-linux]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
          - aarch64-apple-ios
          - aarch64-linux-android
          - wasm32-unknown-unknown

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and target
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.95.0
          target: ${{ matrix.target }}
          cache: false

      - name: Check portable engine library
        run: cargo check --locked -p rustia --lib --target ${{ matrix.target }}

  wasm-node-runtime:
    name: Wasm runtime (Node/V8)
    runs-on:
      group: general-linux
      labels: [self-hosted, Linux, X64, general-linux]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and wasm target
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.95.0
          target: wasm32-unknown-unknown
          cache: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # The shared pool keeps ~/.cargo/bin between jobs, so a bare `cargo
      # install` fails as soon as the binary is already there -- which is what
      # broke this job the first time it was not cancelled by a newer push.
      # Assert the pin instead of installing blind: reinstall when the runner
      # has no wasm-bindgen or the wrong one, and skip when it already matches.
      # If the version string ever stops matching this shape the check simply
      # reinstalls every run, which is slower but never wrong.
      - name: Install matching wasm-bindgen test runner
        run: |
          set -euo pipefail
          if [ "$(wasm-bindgen --version 2>/dev/null || true)" != "wasm-bindgen 0.2.126" ]; then
            cargo install wasm-bindgen-cli --version 0.2.126 --locked --force
          fi
          wasm-bindgen --version

      - name: Run bare wasm host-adapter tests
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: |
          cargo test --locked -p rustia --target wasm32-unknown-unknown --no-default-features --test bare_wasm_live
          cargo test --locked -p rustia --target wasm32-unknown-unknown --no-default-features --test mixed_heap_pressure
          cargo test --locked -p rustia --target wasm32-unknown-unknown --no-default-features --lib engine_boundary_tests::mixed_heap_pressure_preserves_the_short_collection_cadence
          cargo test --locked -p rustia --target wasm32-unknown-unknown --no-default-features --test host_functions
          cargo test --locked -p rustia --target wasm32-unknown-unknown --no-default-features --test typed_objects
          cargo test --locked -p rustia --target wasm32-unknown-unknown --no-default-features --test live_value_contract
          cargo test --locked -p rustia --target wasm32-unknown-unknown --no-default-features --test yieldable_require --test callable_continuations --test numeric_index_contract
          bash tools/run-private-platform-golden.sh wasm bare

      - name: Run default web-live adapter tests on Node/V8
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: |
          cargo test --locked -p rustia --target wasm32-unknown-unknown --test web_live
          cargo test --locked -p rustia --target wasm32-unknown-unknown --test host_functions
          cargo test --locked -p rustia --target wasm32-unknown-unknown --test typed_objects
          cargo test --locked -p rustia --target wasm32-unknown-unknown --test live_value_contract
          cargo test --locked -p rustia --target wasm32-unknown-unknown --test yieldable_require --test callable_continuations --test numeric_index_contract
          bash tools/run-private-platform-golden.sh wasm default

  windows-runtime:
    if: github.event_name == 'workflow_dispatch'
    name: Native runtime (Windows x86-64)
    runs-on:
      group: general-windows
      labels: [self-hosted, Windows, X64, general-windows]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and verify native host
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') { throw 'Expected native Windows x86-64' }
          # Keep the job independent of shared Rust shims and installations.
          $toolRoot = Join-Path $env:RUNNER_TEMP 'rustia-windows-toolchain'
          $env:CARGO_HOME = Join-Path $toolRoot 'cargo'
          $env:RUSTUP_HOME = Join-Path $toolRoot 'rustup'
          New-Item -ItemType Directory -Force -Path $toolRoot | Out-Null
          $installer = Join-Path $toolRoot 'rustup-init.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-pc-windows-msvc/rustup-init.exe' -OutFile $installer
          $expected = '88d8258dcf6ae4f7a80c7d1088e1f36fa7025a1cfd1343731b4ee6f385121fc0'
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Rust installer checksum mismatch' }
          & $installer -y --no-modify-path --profile minimal --default-host x86_64-pc-windows-msvc --default-toolchain 1.95.0
          if ($LASTEXITCODE -ne 0) { throw "Pinned Rust installation failed with exit code $LASTEXITCODE" }
          $cargoBin = Join-Path $env:CARGO_HOME 'bin'
          $env:PATH = "$cargoBin;$env:PATH"
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CARGO_HOME=$env:CARGO_HOME" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RUSTUP_HOME=$env:RUSTUP_HOME" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $version = & (Join-Path $cargoBin 'rustc.exe') -vV
          if ($LASTEXITCODE -ne 0 -or $version -notcontains 'host: x86_64-pc-windows-msvc') { throw 'Rust compiler host does not match Windows x86-64' }
      - name: Execute native correctness contracts
        run: |
          set -euo pipefail
          for mode in default bare; do
            bash tools/run-private-platform-golden.sh native "$mode" x86_64-pc-windows-msvc
            features=()
            if [ "$mode" = bare ]; then features+=(--no-default-features); fi
            cargo test --locked -p rustia --target x86_64-pc-windows-msvc "${features[@]}" \
              --test host_functions --test typed_objects --test live_value_contract \
              --test module_resolution --test yieldable_require \
              --test callable_continuations --test numeric_index_contract
          done
