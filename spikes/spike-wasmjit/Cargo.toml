[package]
name = "spike-wasmjit"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
wasm-encoder = "0.244"
# Reuse the EXACT measured walking-skeleton interpreter (big-match->br_table register VM).
spike-sk-rustia = { path = "../spike-sk-rustia" }

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

# Native helper: emit the runtime-generated modules to disk + sanity-check natively.
[[bin]]
name = "gencheck"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
