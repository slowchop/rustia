[package]
name = "script-bench-harness"
version = "0.0.1"
edition = "2021"
rust-version = "1.95"
description = "Standalone benchmark harness for embedded scripting engines"
readme = "README.md"
repository = "https://github.com/slowchop/rustia"
homepage = "https://github.com/slowchop/rustia"
license = "MIT OR Apache-2.0"
keywords = ["benchmark", "scripting", "lua", "luau", "wasm"]
categories = ["development-tools::profiling"]
publish = false

[features]
default = ["rustia-engine"]
all-engines = [
    "rustia-engine",
    "boa",
    "koto",
    "mlua-luau",
    "rhai-engine",
    "roto",
    "rquickjs-engine",
    "wasmi-engine",
    "wasmtime-engine",
]
rustia-engine = ["dep:rustia-compiler", "dep:rustia-parser", "dep:rustia-vm"]
boa = ["dep:boa_engine"]
koto = ["dep:koto"]
mlua-luau = ["dep:mlua_luau"]
mlua-lua54 = ["dep:mlua_lua54"]
rhai-engine = ["dep:rhai"]
roto = ["dep:roto"]
rquickjs-engine = ["dep:rquickjs"]
wasmi-engine = ["dep:wasmi"]
wasmtime-engine = ["dep:wasmtime"]

[dependencies]
rustia-compiler = { version = "0.0.1", path = "../crates/rustia-compiler", optional = true }
rustia-parser = { version = "0.0.1", path = "../crates/rustia-parser", optional = true }
rustia-vm = { version = "0.0.1", path = "../crates/rustia-vm", optional = true }
koto = { version = "0.16", default-features = false, features = ["arc"], optional = true }
mlua_luau = { package = "mlua", version = "0.11", default-features = false, features = ["luau"], optional = true }
mlua_lua54 = { package = "mlua", version = "0.11", default-features = false, features = ["lua54", "vendored"], optional = true }
rhai = { version = "1.25", optional = true }
boa_engine = { version = "0.21", optional = true }
roto = { version = "0.11", default-features = false, optional = true }
rquickjs = { version = "0.12", optional = true }
serde_json = "1"
wasmi = { version = "2.0.0-beta.4", optional = true }
wasmtime = { version = "46.0.1", default-features = false, features = ["anyhow", "cranelift", "runtime", "std", "wat"], optional = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"

[[bin]]
name = "script-bench"
path = "src/main.rs"
