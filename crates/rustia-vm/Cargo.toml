[package]
name = "rustia-vm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Deterministic Luau virtual machine for rustia"
publish.workspace = true

[features]
default = []
# Opt-in transferable VM, services, Rust payloads, and retained roots.
send = []
# Diagnostic-only path census for numeric array-slot writes. Never enabled in
# production or benchmark builds; the counters exist so a separate test can
# prove which workloads reach the C2.5a direct existing-slot lane.
table-write-diagnostics = []
# Diagnostic-only executor census: which executor (tape, HotIR, closure-call
# fast entry, inline caches) actually ran each workload, and how often guards
# side-exited. Never enabled in production or benchmark builds; the counters
# add unconditional adds to hot paths and carry no semantic change.
executor-diagnostics = []

[dependencies]
gc-arena.workspace = true
libm.workspace = true
smallvec.workspace = true

[lints]
workspace = true
