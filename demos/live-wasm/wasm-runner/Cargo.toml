[package]
name = "rustia-live-wasm"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# The page instantiates this artifact with the raw WebAssembly API and an empty import object.
# Keep the runner on Rustia's bare-Wasm surface; the default `platform-adapters` adapter intentionally
# imports JavaScript glue for applications built through wasm-bindgen.
rustia = { path = "../../../crates/rustia", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
