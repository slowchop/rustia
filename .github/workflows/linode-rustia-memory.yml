name: Rustia Linode Memory

"on":
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit SHA already present on main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rustia-linode-memory-main
  cancel-in-progress: false

jobs:
  benchmark:
    name: Rustia-only dedicated-Linux memory
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout trusted main history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and select benchmark commit
        env:
          BENCHMARK_COMMIT: ${{ inputs.commit_sha }}
        run: |
          if ! [[ "$BENCHMARK_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be an exact lowercase 40-character commit SHA" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git cat-file -e "${BENCHMARK_COMMIT}^{commit}"
          git merge-base --is-ancestor "$BENCHMARK_COMMIT" origin/main
          git checkout --detach "$BENCHMARK_COMMIT"
          test "$(git rev-parse HEAD)" = "$BENCHMARK_COMMIT"

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install Linode credential
        env:
          LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
        run: |
          test -n "$LINODE_TOKEN"
          install -d -m 700 .rustia-benchmark-state/linode
          install -m 600 /dev/null .rustia-benchmark-state/linode/token
          printf '%s\n' "$LINODE_TOKEN" > .rustia-benchmark-state/linode/token

      - name: Freeze per-commit protocol
        env:
          BENCHMARK_COMMIT: ${{ inputs.commit_sha }}
        run: |
          short_commit="${BENCHMARK_COMMIT:0:12}"
          config="bench/cloud/linode-rustia-ci-memory-${short_commit}.json"
          node tools/create-rustia-ci-memory-config.js --output "$config"
          git config user.name "rustia-benchmark"
          git config user.email "benchmark@rustia.invalid"
          git add "$config"
          git commit -m "Freeze Rustia CI memory protocol for ${short_commit} [skip linode]"
          printf 'RUSTIA_MEMORY_CONFIG=%s\n' "$config" >> "$GITHUB_ENV"
          printf 'RUSTIA_MEMORY_COHORT=rustia-ci-%s\n' "$short_commit" >> "$GITHUB_ENV"

      - name: Run Rustia-only Linode memory cohort
        run: node tools/run-linode-benchmark.js bench "$RUSTIA_MEMORY_CONFIG"

      - name: Summarize improvement
        run: |
          node tools/summarize-rustia-ci-memory.js \
            --current bench/memory/current-results.json \
            --history bench/memory/history/runs.jsonl \
            --output rustia-memory-summary.md
          cat rustia-memory-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish benchmark history and dashboard
        env:
          BENCH_DATA_DEPLOY_KEY: ${{ secrets.BENCH_DATA_DEPLOY_KEY }}
          BENCHMARK_COMMIT: ${{ inputs.commit_sha }}
        run: |
          test -n "$BENCH_DATA_DEPLOY_KEY"
          ssh_dir="$RUNNER_TEMP/rustia-bench-ssh"
          data_dir="$RUNNER_TEMP/rustia-bench-data"
          pages_dir="$RUNNER_TEMP/rustia-bench-pages"
          install -d -m 700 "$ssh_dir"
          install -m 600 /dev/null "$ssh_dir/id_ed25519"
          printf '%s\n' "$BENCH_DATA_DEPLOY_KEY" > "$ssh_dir/id_ed25519"
          unset BENCH_DATA_DEPLOY_KEY
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --branch main git@github.com:slowchop/rustia-bench-data.git "$data_dir"
          node tools/merge-rustia-ci-memory-data.js \
            --generated-current bench/memory/current-results.json \
            --generated-history bench/memory/history/runs.jsonl \
            --data-root "$data_dir"
          install -m 644 "$data_dir/bench/memory/current-results.json" bench/memory/current-results.json
          install -m 644 "$data_dir/bench/memory/history/runs.jsonl" bench/memory/history/runs.jsonl
          node bench/render-current-results.js
          install -m 644 bench/current-results.html "$data_dir/bench/current-results.html"
          git -C "$data_dir" config user.name "rustia-benchmark"
          git -C "$data_dir" config user.email "benchmark@rustia.invalid"
          git -C "$data_dir" add bench/memory bench/current-results.html
          if ! git -C "$data_dir" diff --cached --quiet; then
            git -C "$data_dir" commit -m "Record Rustia memory ${BENCHMARK_COMMIT:0:12}"
            git -C "$data_dir" push origin HEAD:main
          fi
          git -C "$data_dir" fetch origin gh-pages
          git -C "$data_dir" worktree add --detach "$pages_dir" origin/gh-pages
          install -m 644 bench/current-results.html "$pages_dir/index.html"
          git -C "$pages_dir" config user.name "rustia-benchmark"
          git -C "$pages_dir" config user.email "benchmark@rustia.invalid"
          git -C "$pages_dir" add index.html
          if ! git -C "$pages_dir" diff --cached --quiet; then
            git -C "$pages_dir" commit -m "Publish Rustia memory ${BENCHMARK_COMMIT:0:12}"
            git -C "$pages_dir" push origin HEAD:gh-pages
          fi

      - name: Confirm cloud cleanup
        if: always()
        run: |
          node tools/run-linode-benchmark.js status > /tmp/rustia-linode-status.json
          jq -r '.[] | select(.cleanup_complete == false) | .run_id' \
            /tmp/rustia-linode-status.json |
            while read -r run_id; do
              node tools/run-linode-benchmark.js destroy "$run_id"
            done
