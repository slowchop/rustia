name: Pull Request Benchmark Screening

# Reports whether a pull request moved performance, to the author, in the job
# summary. It records nothing: no row, no artifact in the published history, no
# write access to either repository. A screening result is a reading for a
# reviewer, not a measurement the project stands behind -- the acceptance
# protocol is what produces those, and it runs far longer than this.
#
# Both sides are measured on the same owned host, in the same session,
# interleaved A B B A across two passes, so drift over the run lands on both
# sides rather than on whichever went second. The baseline is the merge base
# rather than main's tip: an unrelated commit landing mid-review would otherwise
# be attributed to this pull request.
#
# The job also runs the candidate-only live-value serde ABBA microbenchmark.
# That comparison is screening evidence between the direct and explicit owned
# paths in one revision; it is not appended to published benchmark history.
#
# The thresholds come from bench/pr-screening.json, which is measured on this
# host by `run-dedicated-benchmark.js calibrate` and committed. There is no
# default threshold, deliberately -- a guessed figure that happens to sit inside
# the host's own spread reports movement on changes that did nothing.
"on":
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustia-bench-pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  screen:
    name: Screen this pull request
    # Fork pull requests never reach the benchmark host. The repository is
    # private today, so every author is already trusted and this guard changes
    # nothing; it is here so that going public does not silently hand a stranger
    # code execution on the machine that produces every published number, which
    # holds persistent cargo roots and target directories that later runs read.
    # Fork pull requests still get ci.yml. They simply get no benchmark.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: bench-solo
    timeout-minutes: 40

    steps:
      - name: Checkout the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.95.0
          cache: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Screen against the merge base
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d "$RUNNER_TEMP/rustia-screen.XXXXXX")"
          trap 'rm -rf -- "$work_dir"' EXIT
          # The base comes from the event payload, not from a remote-tracking
          # ref. This job drops its credentials on checkout, so it cannot fetch
          # anything -- and it does not need to: fetch-depth 0 already brought
          # the base branch down, and a commit id needs no ref to resolve. The
          # first version fetched here and died on "could not read Username",
          # having asked a credential-less job to talk to a private remote.
          node tools/run-dedicated-benchmark.js pr \
            --local \
            --base "${{ github.event.pull_request.base.sha }}" \
            --out "$work_dir/summary.md" \
            --json "$work_dir/screening.json"
          cat "$work_dir/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Compare live and owned serde paths
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d "$RUNNER_TEMP/rustia-live-serde.XXXXXX")"
          trap 'rm -rf -- "$work_dir"' EXIT
          node tools/run-dedicated-benchmark.js live-serde \
            --local \
            --out "$work_dir/summary.md"
          cat "$work_dir/summary.md" >> "$GITHUB_STEP_SUMMARY"

  calibrate:
    name: Recalibrate the screening thresholds
    # Measures one revision against itself and prints the thresholds it observed.
    # It writes nothing to the repository: adopting a calibration is a deliberate
    # commit, because it changes what every later pull request is judged against.
    if: github.event_name == 'workflow_dispatch'
    runs-on:
      group: bench-solo
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.95.0
          cache: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Measure this host against itself
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d "$RUNNER_TEMP/rustia-calibrate.XXXXXX")"
          trap 'rm -rf -- "$work_dir"' EXIT
          node tools/run-dedicated-benchmark.js calibrate --local --out "$work_dir/pr-screening.json"
          {
            echo "## Screening calibration"
            echo
            echo "Commit and replace bench/pr-screening.json with this to adopt it."
            echo
            echo '```json'
            cat "$work_dir/pr-screening.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
