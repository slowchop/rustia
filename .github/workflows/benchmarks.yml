name: Benchmark Measurement

"on":
  push:
    branches:
      - main
  schedule:
    - cron: "17 16 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Benchmark scope"
        required: true
        default: rustia
        type: choice
        options:
          - rustia
          - full

permissions:
  contents: read

env:
  BENCH_DATA_REPO: git@github.com:slowchop/rustia-bench-data.git
  BENCH_RESULT_FILES: |
    bench/history/runs.jsonl
    bench/RESULTS.md
    bench/current-results.json
    bench/current-results.html
    bench/CLAIMS.md

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure-rustia-current:
    name: Measure Rustia benchmark matrix
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'rustia')
    runs-on:
      - self-hosted
      - bench
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal

      - name: Use Rust stable
        run: rustup default stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure benchmark data SSH
        env:
          BENCH_DATA_DEPLOY_KEY: ${{ secrets.BENCH_DATA_DEPLOY_KEY }}
        run: |
          key_path="$RUNNER_TEMP/rustia_bench_data_key"
          known_hosts_path="$RUNNER_TEMP/known_hosts"
          printf '%s\n' "$BENCH_DATA_DEPLOY_KEY" > "$key_path"
          chmod 600 "$key_path"
          ssh-keyscan github.com > "$known_hosts_path"
          {
            printf 'GIT_SSH_COMMAND='
            printf 'ssh -i %q -o IdentitiesOnly=yes -o UserKnownHostsFile=%q' "$key_path" "$known_hosts_path"
            printf '\n'
          } >> "$GITHUB_ENV"

      - name: Verify clean checkout
        run: |
          git diff --quiet --ignore-submodules --
          git diff --cached --quiet --ignore-submodules --

      - name: Restore benchmark history
        run: |
          if git ls-remote --exit-code --heads "$BENCH_DATA_REPO" main >/dev/null 2>&1; then
            data_dir="$(mktemp -d)"
            git clone --depth 1 "$BENCH_DATA_REPO" "$data_dir"
            if [ -f "$data_dir/bench/history/runs.jsonl" ]; then
              cp "$data_dir/bench/history/runs.jsonl" bench/history/runs.jsonl
            fi
          fi

      - name: Run Rustia benchmark binary
        run: >
          cargo run -p script-bench-harness --release --
          --engines rustia
          --history bench/history/runs.jsonl
          --commit "$(git rev-parse --short HEAD)"

      - name: Refresh generated benchmark reports
        run: |
          cargo run -p script-bench-harness -- --refresh-results
          node bench/render-current-results.js
          node bench/render-claims.js

      - name: Check generated benchmark artifacts
        run: |
          node tools/check-benchmark-results.js
          node bench/render-current-results.js --check
          node bench/render-claims.js --check

      - name: Publish benchmark results
        run: |
          result_archive="$(mktemp)"
          publish_dir="$(mktemp -d)"
          tar -cf "$result_archive" $BENCH_RESULT_FILES
          if git ls-remote --exit-code --heads "$BENCH_DATA_REPO" main >/dev/null 2>&1; then
            rm -rf "$publish_dir"
            git clone "$BENCH_DATA_REPO" "$publish_dir"
          else
            git init "$publish_dir"
            git -C "$publish_dir" switch -c main
            git -C "$publish_dir" remote add origin "$BENCH_DATA_REPO"
          fi
          tar -xf "$result_archive" -C "$publish_dir"
          (
            cd "$publish_dir"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $BENCH_RESULT_FILES
          )
          if git -C "$publish_dir" diff --cached --quiet; then
            echo "No benchmark result changes to commit."
            exit 0
          fi
          short_sha="$(git rev-parse --short "$GITHUB_SHA")"
          git -C "$publish_dir" commit -m "Record Rustia benchmark results for ${short_sha}"
          git -C "$publish_dir" push origin "HEAD:main"

  measure-full-current:
    name: Measure full benchmark matrix
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
    runs-on:
      - self-hosted
      - bench
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal

      - name: Use Rust stable
        run: rustup default stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure benchmark data SSH
        env:
          BENCH_DATA_DEPLOY_KEY: ${{ secrets.BENCH_DATA_DEPLOY_KEY }}
        run: |
          key_path="$RUNNER_TEMP/rustia_bench_data_key"
          known_hosts_path="$RUNNER_TEMP/known_hosts"
          printf '%s\n' "$BENCH_DATA_DEPLOY_KEY" > "$key_path"
          chmod 600 "$key_path"
          ssh-keyscan github.com > "$known_hosts_path"
          {
            printf 'GIT_SSH_COMMAND='
            printf 'ssh -i %q -o IdentitiesOnly=yes -o UserKnownHostsFile=%q' "$key_path" "$known_hosts_path"
            printf '\n'
          } >> "$GITHUB_ENV"

      - name: Verify clean checkout
        run: |
          git diff --quiet --ignore-submodules --
          git diff --cached --quiet --ignore-submodules --

      - name: Restore benchmark history
        run: |
          if git ls-remote --exit-code --heads "$BENCH_DATA_REPO" main >/dev/null 2>&1; then
            data_dir="$(mktemp -d)"
            git clone --depth 1 "$BENCH_DATA_REPO" "$data_dir"
            if [ -f "$data_dir/bench/history/runs.jsonl" ]; then
              cp "$data_dir/bench/history/runs.jsonl" bench/history/runs.jsonl
            fi
          fi

      - name: Run all-engines benchmark binary
        run: >
          cargo run -p script-bench-harness --release --features all-engines --
          --history bench/history/runs.jsonl
          --commit "$(git rev-parse --short HEAD)"

      - name: Run Lua 5.4 benchmark binary
        run: >
          cargo run -p script-bench-harness --release --no-default-features
          --features mlua-lua54 --
          --engines mlua-lua54
          --history bench/history/runs.jsonl
          --commit "$(git rev-parse --short HEAD)"

      - name: Refresh generated benchmark reports
        run: |
          cargo run -p script-bench-harness -- --refresh-results
          node bench/render-current-results.js
          node bench/render-claims.js

      - name: Check generated benchmark artifacts
        run: |
          node tools/check-benchmark-results.js
          node bench/render-current-results.js --check
          node bench/render-claims.js --check

      - name: Publish benchmark results
        run: |
          result_archive="$(mktemp)"
          publish_dir="$(mktemp -d)"
          tar -cf "$result_archive" $BENCH_RESULT_FILES
          if git ls-remote --exit-code --heads "$BENCH_DATA_REPO" main >/dev/null 2>&1; then
            rm -rf "$publish_dir"
            git clone "$BENCH_DATA_REPO" "$publish_dir"
          else
            git init "$publish_dir"
            git -C "$publish_dir" switch -c main
            git -C "$publish_dir" remote add origin "$BENCH_DATA_REPO"
          fi
          tar -xf "$result_archive" -C "$publish_dir"
          (
            cd "$publish_dir"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $BENCH_RESULT_FILES
          )
          if git -C "$publish_dir" diff --cached --quiet; then
            echo "No benchmark result changes to commit."
            exit 0
          fi
          short_sha="$(git rev-parse --short "$GITHUB_SHA")"
          git -C "$publish_dir" commit -m "Record full benchmark results for ${short_sha}"
          git -C "$publish_dir" push origin "HEAD:main"
