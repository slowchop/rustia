<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rustia Live Wasm</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #111317;
        --panel: #181c22;
        --panel-2: #202630;
        --text: #eef2f6;
        --muted: #a8b3c1;
        --line: #323b49;
        --accent: #48d597;
        --accent-2: #7cb7ff;
        --bad: #ff6b6b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .shell {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 100vh;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
        background: #0f1115;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 650;
      }

      .status {
        color: var(--muted);
        font-size: 13px;
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(320px, 0.85fr);
        min-height: 0;
      }

      .pane {
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-template-rows: auto 1fr;
        border-right: 1px solid var(--line);
      }

      .pane:last-child {
        border-right: 0;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }

      button,
      select {
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--text);
        border-radius: 6px;
        height: 34px;
        padding: 0 10px;
        font: inherit;
      }

      button {
        cursor: pointer;
        font-weight: 650;
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #07130d;
      }

      textarea,
      pre {
        margin: 0;
        width: 100%;
        height: 100%;
        min-height: 0;
        border: 0;
        outline: 0;
        resize: none;
        padding: 16px;
        background: #12161c;
        color: var(--text);
        font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        tab-size: 2;
      }

      pre {
        white-space: pre-wrap;
        overflow: auto;
      }

      .ok {
        color: var(--accent);
      }

      .error {
        color: var(--bad);
      }

      @media (max-width: 760px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        main {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(360px, 1fr) minmax(260px, 0.7fr);
        }

        .pane {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <h1>Rustia Live Wasm</h1>
        <div id="status" class="status">loading wasm...</div>
      </header>
      <main>
        <section class="pane">
          <div class="toolbar">
            <button id="run" class="primary" type="button">Run</button>
            <select id="examples" aria-label="Examples">
              <option value="math">math + strings</option>
              <option value="table">table.insert/remove</option>
              <option value="loop">loop</option>
              <option value="error">error</option>
            </select>
          </div>
          <textarea id="editor" spellcheck="false"></textarea>
        </section>
        <section class="pane">
          <div class="toolbar">
            <span>Output</span>
          </div>
          <pre id="output"></pre>
        </section>
      </main>
    </div>

    <script type="module">
      const wasmPath = "./wasm-runner/target/wasm32-unknown-unknown/release/rustia_live_wasm.wasm";
      const statusEl = document.getElementById("status");
      const outputEl = document.getElementById("output");
      const editorEl = document.getElementById("editor");
      const examplesEl = document.getElementById("examples");
      const runEl = document.getElementById("run");

      const examples = {
        math: `local x = math.round(2.6) + math.floor("3.9")
local s = string.upper("rustia")
return s .. ":" .. x`,
        table: `local a = {}
table.insert(a, 10)
table.insert(a, 2, 20)
table.insert(a, 1, -1)
table.insert(a, 40)
table.insert(a, table.getn(a) + 1, 50)
table.insert(a, 2, -2)
return table.concat(a, ",")`,
        loop: `local sum = 0
for i = 1, 10 do
  sum += i
end
return sum`,
        error: `local t = {}
t[nil] = 1
return t`,
      };

      let wasm;
      let memory;

      function setOutput(text) {
        outputEl.textContent = text;
        outputEl.className = text.startsWith("ok") ? "ok" : text.startsWith("error") ? "error" : "";
      }

      function readString(ptr, len) {
        const bytes = new Uint8Array(memory.buffer, ptr, len);
        return new TextDecoder().decode(bytes);
      }

      function writeString(text) {
        const bytes = new TextEncoder().encode(text);
        const ptr = wasm.rustia_alloc(bytes.length);
        new Uint8Array(memory.buffer, ptr, bytes.length).set(bytes);
        return { ptr, len: bytes.length };
      }

      async function loadWasm() {
        const response = await fetch(wasmPath);
        if (!response.ok) {
          throw new Error(`missing wasm artifact: ${wasmPath}`);
        }
        const bytes = await response.arrayBuffer();
        const module = await WebAssembly.instantiate(bytes, {});
        wasm = module.instance.exports;
        memory = wasm.memory;
        statusEl.textContent = "wasm ready";
      }

      function run() {
        if (!wasm) {
          setOutput("error\nwasm is not loaded yet");
          return;
        }
        const input = writeString(editorEl.value);
        try {
          wasm.rustia_run(input.ptr, input.len);
          const result = readString(wasm.rustia_result_ptr(), wasm.rustia_result_len());
          setOutput(result);
        } finally {
          wasm.rustia_dealloc(input.ptr, input.len);
        }
      }

      examplesEl.addEventListener("change", () => {
        editorEl.value = examples[examplesEl.value];
        run();
      });

      runEl.addEventListener("click", run);
      editorEl.addEventListener("keydown", (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
          event.preventDefault();
          run();
        }
      });

      editorEl.value = examples.math;

      try {
        await loadWasm();
        run();
      } catch (error) {
        statusEl.textContent = "wasm missing";
        setOutput(`error\n${error.message}\n\nBuild it with:\ncargo build --manifest-path demos/live-wasm/wasm-runner/Cargo.toml --target wasm32-unknown-unknown --release`);
      }
    </script>
  </body>
</html>
