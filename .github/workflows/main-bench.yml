name: Per-Commit Rustia Series

# Measures each commit that lands on main under exactly the protocol the
# reconstruction used, so the published chart continues rather than restarting.
# Timing runs on the qualified owned host, which is the only class permitted to
# produce one, and only through run-dedicated-benchmark.js, which attests the
# machine against the frozen config before it builds anything.
#
# The rows are appended to the published data repository, not to this one: they
# grow with every commit and have no business in source history, which is the
# same split the memory lane already uses. This workflow therefore holds no
# contents-write on this repository.
#
# A commit that builds a byte-identical binary records nothing. That gate is
# exact rather than a path heuristic, so a documentation or tooling commit does
# not add a duplicate point claiming to be a new measurement.
"on":
  push:
    branches:
      - main

permissions:
  contents: read

# Host exclusivity comes from the bench-solo group holding exactly one runner:
# a second job sent there waits rather than sharing the machine. This shared
# concurrency group adds ordering between the four lanes that hold the host for
# a full measurement -- this one, the cross-engine matrix, the memory cohort and
# acceptance -- so they start in the order they began waiting.
#
# queue: max is what makes it a queue. Without it a group keeps one pending run
# and a newly queued run cancels it; cancel-in-progress: false protects only the
# run already going. That is how this lane lost its run for f49646f on
# 2026-09-15, to a matrix dispatch fourteen seconds later. Order matters most
# here: rows are appended in the order runs execute, the chart draws them in
# file order, and the unchanged-binary gate compares against the last row. The
# runner queue documents no order at all, which is why the group stays rather
# than leaving the waiting to bench-solo alone.
#
# PR screening deliberately sits outside it, because it cancels its own
# superseded runs, and GitHub rejects cancel-in-progress: true alongside
# queue: max. It relies on the single-runner group alone, so registering a
# second runner into bench-solo would let a screening run and a measurement
# share the same pinned cores.
concurrency:
  group: rustia-bench-host-serial
  cancel-in-progress: false
  queue: max

jobs:
  measure:
    name: Measure this commit
    if: github.ref == 'refs/heads/main'
    runs-on:
      group: bench-solo
    timeout-minutes: 30

    steps:
      - name: Checkout the measured commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.95.0
          cache: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Measure and publish the series row
        env:
          BENCH_DATA_DEPLOY_KEY: ${{ secrets.BENCH_DATA_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$BENCH_DATA_DEPLOY_KEY"
          work_dir="$(mktemp -d "$RUNNER_TEMP/rustia-series.XXXXXX")"
          ssh_dir="$work_dir/ssh"
          data_dir="$work_dir/data"
          cleanup() {
            rm -rf -- "$work_dir"
          }
          trap cleanup EXIT
          install -d -m 700 "$ssh_dir"
          install -m 600 /dev/null "$ssh_dir/id_ed25519"
          printf '%s\n' "$BENCH_DATA_DEPLOY_KEY" > "$ssh_dir/id_ed25519"
          unset BENCH_DATA_DEPLOY_KEY
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$ssh_dir/known_hosts"

          git clone --branch main git@github.com:slowchop/rustia-bench-data.git "$data_dir"
          rows_file="$data_dir/bench/history/series/ci-bench-main.jsonl"

          # The binary hash of the last measured commit, so an unchanged engine
          # is skipped rather than recorded twice.
          previous=""
          if [ -s "$rows_file" ]; then
            previous="$(node -e 'const fs=require("fs");const lines=fs.readFileSync(process.argv[1],"utf8").trim().split("\n");console.log(JSON.parse(lines[lines.length-1]).binary_sha256 ?? "")' "$rows_file")"
          fi

          node tools/run-dedicated-benchmark.js main --local --out "$work_dir/rows.jsonl" ${previous:+--previous-binary "$previous"}

          if [ ! -s "$work_dir/rows.jsonl" ]; then
            echo "no engine change; nothing recorded" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          install -d "$data_dir/bench/history/series"
          cat "$work_dir/rows.jsonl" >> "$rows_file"

          # Validated against the committed protocol before anything is pushed,
          # so a row that does not belong to this series never reaches the
          # published data.
          node tools/check-benchmark-series.js --rows-root "$data_dir"

          git -C "$data_dir" config user.name "rustia-benchmark"
          git -C "$data_dir" config user.email "benchmark@rustia.invalid"
          git -C "$data_dir" add bench/history/series/ci-bench-main.jsonl
          git -C "$data_dir" commit -m "Record per-commit series row $(git rev-parse --short HEAD)"
          node tools/push-benchmark-data-publication.js --repo-dir "$data_dir" --kind series

          {
            echo "## Series row recorded"
            echo
            echo "Commit \`$(git rev-parse --short HEAD)\` measured on the owned benchmark host."
            echo
            echo '```'
            cat "$work_dir/rows.jsonl"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
