[package]
name = "rustia-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Luau-to-rustia bytecode compiler"
publish = ["crates-io"]

[features]
default = []
# Enables the default-off `rustia-vm` numeric array-slot write census used by
# `tests/array_slot_write_coverage.rs`. Never enabled for benchmark builds.
table-write-diagnostics = ["rustia-vm/table-write-diagnostics"]
# Enables the default-off `rustia-vm` executor census used by
# `tests/executor_ownership.rs`. Never enabled for benchmark builds.
executor-diagnostics = ["rustia-vm/executor-diagnostics"]

[dependencies]
rustia-lexer.workspace = true
rustia-parser.workspace = true
rustia-vm.workspace = true

[lints]
workspace = true
