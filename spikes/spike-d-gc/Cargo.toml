[package]
name = "spike-d-gc"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
gc-arena = "0.6.0"
slotmap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
debug = true

[[bin]]
name = "spike"
path = "src/main.rs"

[[bin]]
name = "miri_send"
path = "src/miri_send.rs"
