name: Rustia Memory Cohort

# Measures per-VM memory for one exact commit on the owned benchmark host.
#
# It used to provision a billed Linode. Nothing in this repository can create a
# cloud instance any more; this was the last lane that could, and it could only
# ever do so by explicit dispatch. Timing and sampling now run on `ci-bench`,
# reached only through run-dedicated-benchmark.js, which attests the machine
# against the frozen config before it builds anything.
#
# One of two cohorts, same protocol, same entrypoint, different engine set.
# rustia-only is the routine per-commit cohort: 11 Rustia rows. cross-engine
# measures the thirteen matrix engines, 110 rows, and is what puts the
# competitor rows and the mlua/Luau/JIT reference on the same machine as the
# Rustia rows they are compared with. Its build carries twelve competitor
# crates, so it takes materially longer; the timeout below is its ceiling.
#
# The protocol pins two isolated cores rather than one: the supervisor samples
# while the benchmark runs, and sharing a core would make the supervisor part of
# what it measures.
#
# Results go to the published data repository, not to this one, which is why
# this workflow holds no contents-write on this repository.
#
# Measurement runs the measured commit's own tools: the checkout is detached at
# it before anything is built. Merging into the data repository does not. The
# merge is where a row's machine is checked, and a merge tool from before host
# labels checks nothing about it, so the merge and the push run from copies of
# main's tools, taken before the detach. A commit from before a row's host was
# confined to a label cannot be measured through this lane at all: its rows
# might not name their machine by one, and it is refused before the measurement
# rather than after.
"on":
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit SHA already present on main
        required: true
        type: string
      cohort:
        description: Which engines to measure
        required: false
        default: rustia-only
        type: choice
        options:
          - rustia-only
          - cross-engine

permissions:
  contents: read

# Waits in start order behind the other full-measurement lanes rather than
# cancelling one already waiting; main-bench.yml carries the reasoning.
concurrency:
  group: rustia-bench-host-serial
  cancel-in-progress: false
  queue: max

jobs:
  benchmark:
    name: Memory cohort on the owned host
    if: github.ref == 'refs/heads/main'
    runs-on:
      group: bench-solo
    timeout-minutes: 75

    steps:
      - name: Checkout trusted main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and select benchmark commit
        env:
          BENCHMARK_COMMIT: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$BENCHMARK_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be an exact lowercase 40-character commit SHA" >&2
            exit 1
          fi
          git cat-file -e "${BENCHMARK_COMMIT}^{commit}"
          git merge-base --is-ancestor "$BENCHMARK_COMMIT" origin/main
          # The tree is still main here. The merge into the data repository and
          # the push there run from these copies, not from the measured commit.
          # Both require only node: builtins, so a copy runs from anywhere.
          trusted_tools="$RUNNER_TEMP/rustia-trusted-tools"
          install -d -m 700 "$trusted_tools"
          install -m 644 tools/merge-rustia-ci-memory-data.js "$trusted_tools/merge-rustia-ci-memory-data.js"
          install -m 644 tools/push-benchmark-data-publication.js "$trusted_tools/push-benchmark-data-publication.js"
          git checkout --detach "$BENCHMARK_COMMIT"
          test "$(git rev-parse HEAD)" = "$BENCHMARK_COMMIT"
          # From here the tree is the measured commit. Every file that emits or
          # validates a host label carries this line verbatim, and
          # bench/analyze-memory-samples.js has carried it since labels were
          # confined to this character set. A commit without it may stamp a
          # host that is not a label, or none, so it is refused now rather than
          # at the merge after an hour on the host.
          if ! grep -qxF 'const HOST_LABEL = /^[A-Za-z0-9_-]{1,128}$/;' bench/analyze-memory-samples.js; then
            echo "::error::${BENCHMARK_COMMIT:0:12} predates the host-label rule: its bench/analyze-memory-samples.js does not confine a row's host to a label, and the data repository takes no row whose host is not one. Dispatch a commit at or after the host-label merge instead."
            exit 1
          fi

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.95.0
          cache: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # The measured commit's own tools run here, since the checkout above is
      # detached at it, and the gate above means that commit labels its rows.
      # The routine cohort keeps the bare line for the labelled commits that
      # predate the --cohort flag; only the cross-engine cohort passes the flag,
      # and only commits that carry its freezer can measure it. An API dispatch
      # that omits the input leaves it empty, and empty is the routine cohort: a
      # bare dispatch must not become the long one.
      - name: Measure and promote the memory cohort
        env:
          COHORT: ${{ inputs.cohort }}
        run: |
          set -euo pipefail
          if [ "${COHORT:-rustia-only}" = rustia-only ]; then
            node tools/run-dedicated-benchmark.js memory --local
          else
            node tools/run-dedicated-benchmark.js memory --local --cohort "$COHORT"
          fi

      - name: Summarize improvement
        run: |
          node tools/summarize-rustia-ci-memory.js \
            --current bench/memory/current-results.json \
            --history bench/memory/history/runs.jsonl \
            --output rustia-memory-summary.md
          cat rustia-memory-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish measured memory data only
        env:
          BENCH_DATA_DEPLOY_KEY: ${{ secrets.BENCH_DATA_DEPLOY_KEY }}
          BENCHMARK_COMMIT: ${{ inputs.commit_sha }}
          COHORT: ${{ inputs.cohort }}
        run: |
          set -euo pipefail
          test -n "$BENCH_DATA_DEPLOY_KEY"
          ssh_dir="$RUNNER_TEMP/rustia-bench-ssh"
          data_dir="$RUNNER_TEMP/rustia-bench-data"
          trusted_tools="$RUNNER_TEMP/rustia-trusted-tools"
          install -d -m 700 "$ssh_dir"
          install -m 600 /dev/null "$ssh_dir/id_ed25519"
          printf '%s\n' "$BENCH_DATA_DEPLOY_KEY" > "$ssh_dir/id_ed25519"
          unset BENCH_DATA_DEPLOY_KEY
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --branch main git@github.com:slowchop/rustia-bench-data.git "$data_dir"
          node "$trusted_tools/merge-rustia-ci-memory-data.js" \
            --generated-current bench/memory/current-results.json \
            --generated-history bench/memory/history/runs.jsonl \
            --data-root "$data_dir"
          git -C "$data_dir" config user.name "rustia-benchmark"
          git -C "$data_dir" config user.email "benchmark@rustia.invalid"
          git -C "$data_dir" add bench/memory
          if ! git -C "$data_dir" diff --cached --quiet; then
            git -C "$data_dir" commit -m "Record ${COHORT:-rustia-only} memory ${BENCHMARK_COMMIT:0:12}"
            node "$trusted_tools/push-benchmark-data-publication.js" --repo-dir "$data_dir" --kind memory
          fi

  # Measurement may select historical code. Publication must not: the merge
  # and push above run main's copies of their tools, and the shared publisher
  # checks out current main, reads current data-owned memory/series, and
  # serializes every Pages write in its separate publication group.
  publish:
    needs: benchmark
    uses: ./.github/workflows/publish-benchmark-data.yml
    permissions:
      contents: read
    secrets:
      BENCH_DATA_DEPLOY_KEY: ${{ secrets.BENCH_DATA_DEPLOY_KEY }}
