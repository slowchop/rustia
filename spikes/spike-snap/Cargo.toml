[package]
name = "spike-snap"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
slotmap = "1.1.1"
im = "15.1.0"
rpds = "1"
bincode = "1.3.3"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bin]]
name = "snap"
path = "src/main.rs"
