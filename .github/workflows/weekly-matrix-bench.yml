name: Cross-Engine Matrix (weekly)

# Measures all thirteen engines across the five workloads on the owned benchmark
# host. This is the only producer of the cross-engine comparison and of the
# mlua/Luau/JIT reference every published Rustia number is normalised against.
#
# It used to run nightly on an ephemeral dedicated Linode, gated on whether main
# had gained performance-relevant commits since the last cohort. Both of those
# are gone. The gate asked the Rustia-progress question, which the per-commit
# series now answers directly and continuously; this lane asks about competitors,
# and running it unconditionally also gives a host-drift signal -- kernel,
# microcode, thermal -- that a gated run would hide. The cost is forty minutes of
# an otherwise idle machine rather than a bill.
#
# Timing runs on the qualified owned host and only through
# run-dedicated-benchmark.js, which attests the machine against the frozen config
# before it builds anything. This workflow is the single sanctioned holder of
# contents-write: the cohort belongs in this repository's history, unlike the
# per-commit series, whose rows grow forever and live in the data repository.
#
# main takes changes only through pull requests -- an organisation rule covering
# every active private repository, which no workflow token can bypass -- so the
# accepted cohort is pushed to a branch and landed by
# tools/land-matrix-publication.js, which opens the pull request and merges it
# with a merge commit.
#
# The landing merge is made as the slowchop-ops-controller app rather than with
# the workflow token, and that identity is the point: a named app can be a
# ruleset bypass actor, github-actions[bot] cannot, so this is what lets main
# require status checks at all. Only the merge uses the app token. The
# dispatches below stay on the workflow token because the app holds
# actions: read and dispatching a workflow needs write.
#
# Nothing runs on that pull request. The publication commit carries GitHub's
# CI-skip marker, so no pull-request run is created -- and a required check
# that never reports would block the merge for good, which is precisely what
# the app's bypass answers. The marker predates the app: runs on a pull request
# the workflow token opened were held for an approval the merge never gave, and
# the first landing (#40) left three failed runs with no jobs behind it.
#
# Weekly on Sunday 15:00 UTC (early Monday morning at the host, when the machine
# is idle), plus manual dispatch for an out-of-cycle cohort. The schedule was
# withheld until the first owned-host cohort (f480758, 2026-08-30) had landed and
# been looked at. A scheduled run sees the default branch as github.ref, so the
# main-only guard below holds for both triggers.
"on":
  schedule:
    - cron: "0 15 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

# Waits in start order behind the other full-measurement lanes rather than
# cancelling one already waiting; main-bench.yml carries the reasoning.
concurrency:
  group: rustia-bench-host-serial
  cancel-in-progress: false
  queue: max

jobs:
  matrix:
    name: Cross-engine matrix on the owned host
    if: github.ref == 'refs/heads/main'
    runs-on:
      group: bench-solo
    timeout-minutes: 120

    steps:
      - name: Checkout trusted main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.95.0
          target: wasm32-unknown-unknown
          cache: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Measure and promote the cohort
        run: |
          set -euo pipefail
          benchmark_commit="$(git rev-parse HEAD)"
          short_commit="${benchmark_commit:0:12}"
          node tools/run-dedicated-benchmark.js matrix --local
          printf 'RUSTIA_MATRIX_COMMIT=%s\n' "$short_commit" >> "$GITHUB_ENV"
          printf 'RUSTIA_BENCHMARK_COMMIT=%s\n' "$benchmark_commit" >> "$GITHUB_ENV"

      # Minted after the measurement rather than at job start: an installation
      # token lives one hour and the cohort takes about forty minutes.
      - name: Mint the landing token
        id: landing-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.OPS_CONTROLLER_APP_ID }}
          private-key: ${{ secrets.OPS_CONTROLLER_PRIVATE_KEY }}

      - name: Publish the accepted cohort to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUSTIA_LANDING_TOKEN: ${{ steps.landing-token.outputs.token }}
        run: |
          set -euo pipefail
          config="bench/cloud/dedicated-cross-engine-matrix-${RUSTIA_MATRIX_COMMIT}.json"
          git config user.name "rustia-benchmark"
          git config user.email "benchmark@rustia.invalid"
          # Snapshot the promoted artifacts, then rebuild the publication as one
          # fresh commit on top of a freshly fetched main, so a long measurement
          # never has to rebase over commits that landed while it ran.
          git add bench design tools/check-benchmark-results.js
          git commit -m "Local promotion snapshot ${RUSTIA_MATRIX_COMMIT}"
          snapshot="$(git rev-parse HEAD)"
          branch="matrix-publish/${RUSTIA_MATRIX_COMMIT}"
          published=""
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B "$branch" origin/main
            # Every file rendered below describes this commit, so the landing
            # helper merges only while main is still exactly this commit.
            base_commit="$(git rev-parse HEAD)"
            git checkout "$snapshot" -- \
              "$config" \
              bench/history \
              bench/evidence/matrix \
              bench/wasm/current-results.json \
              bench/wasm/dispatch-current-results.json
            git checkout origin/main -- tools/check-benchmark-results.js
            node tools/register-matrix-cohort.js --commit "$RUSTIA_BENCHMARK_COMMIT"
            # Re-derives the report tables from the committed history. This mode
            # returns before any measurement; it is not a timing.
            cargo run -p script-bench-harness -- --refresh-results
            node tools/check-package-files.js
            node tools/check-publishability.js
            node tools/render-benchmark-operations-status.js
            node bench/render-current-results.js
            node bench/render-claims.js
            node tools/check-benchmark-results.js
            # The release-preflight checkers whose result this commit can
            # change and that nothing above runs. A cohort that would turn
            # main red is not landed; CI on main still covers everything else.
            node tools/check-wasm-gate-results.js
            node tools/check-project-status.js
            git add bench design tools/check-benchmark-results.js
            # The marker stops GitHub creating pull-request runs on this
            # branch (see the header), which is what the app's ruleset bypass
            # answers for. Only this commit carries it: the title below becomes
            # the body of main's merge commit, so main's tip is unmarked and
            # the merge's own push runs are created normally. If a person
            # merged this pull request by hand, a marker on main would skip CI,
            # the per-commit series and the dashboard publication.
            git commit -m "Publish cross-engine matrix ${RUSTIA_MATRIX_COMMIT} [skip ci]"
            publication_commit="$(git rev-parse HEAD)"
            git push --force origin "HEAD:refs/heads/$branch"
            # Exit 3 means main moved, so the publication no longer describes
            # it and is rebuilt; anything else that is not success is a
            # failure, and the helper has already printed GitHub's reason.
            landing=0
            GITHUB_TOKEN="$RUSTIA_LANDING_TOKEN" \
            node tools/land-matrix-publication.js \
              --branch "$branch" \
              --base "$base_commit" \
              --head "$publication_commit" \
              --title "Publish cross-engine matrix ${RUSTIA_MATRIX_COMMIT}" || landing=$?
            if [ "$landing" -eq 0 ]; then
              published=yes
              break
            fi
            [ "$landing" -eq 3 ] || exit "$landing"
            echo "main moved before the publication could land (attempt $attempt of 3)"
          done
          if [ -z "$published" ]; then
            echo "main moved under the publication on all three attempts; nothing was landed" >&2
            exit 1
          fi
          # A merge made with the app token does start push workflows, unlike
          # one made with the workflow token, so these dispatches may duplicate
          # runs the merge already created. Both targets tolerate that: CI on
          # main shares one concurrency group, and the dashboard publication
          # commits only when its render actually changes. They are kept until
          # a landing has shown which runs the merge creates by itself, because
          # a cohort that lands without CI costs another forty minutes of host
          # time to recover. Each is attempted whatever happens to the other,
          # and a failure names what to dispatch by hand. The per-commit series
          # is still not dispatched, but the merge's own push now reaches it:
          # the publication changes no engine code, so its byte-identical gate
          # records nothing, at the cost of one build on the host.
          failed=""
          curl -sSf -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/publish-benchmark-data.yml/dispatches" \
            -d '{"ref":"main"}' || failed="publish-benchmark-data.yml"
          curl -sSf -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" \
            -d '{"ref":"main"}' || failed="${failed:+$failed and }ci.yml"
          if [ -n "$failed" ]; then
            echo "::error::The cohort has landed, but dispatching $failed on main failed. Dispatch each one named here on main by hand; re-running this job would measure and land another cohort." >&2
            exit 1
          fi
