[workspace]
members = [
    "bench",
    "crates/rustia",
    "crates/rustia-cli",
    "crates/rustia-compiler",
    "crates/rustia-conformance",
    "crates/rustia-lexer",
    "crates/rustia-parser",
    "crates/rustia-vm",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/slowchop/rustia"
homepage = "https://github.com/slowchop/rustia"
keywords = ["luau", "scripting", "deterministic", "wasm", "embedding"]
categories = ["compilers", "game-development", "wasm"]
publish = false

[workspace.dependencies]
gc-arena = "0.6.0"
libm = "0.2"
serde = { version = "1", features = ["derive"] }
rustia = { version = "0.0.1", path = "crates/rustia" }
rustia-compiler = { version = "0.0.1", path = "crates/rustia-compiler" }
rustia-lexer = { version = "0.0.1", path = "crates/rustia-lexer" }
rustia-parser = { version = "0.0.1", path = "crates/rustia-parser" }
rustia-vm = { version = "0.0.1", path = "crates/rustia-vm" }

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"
