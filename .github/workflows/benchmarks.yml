name: Benchmark Measurement

"on":
  push:
    branches:
      - main
  schedule:
    - cron: "17 16 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Benchmark scope"
        required: true
        default: rustia
        type: choice
        options:
          - rustia
          - full
      publish:
        description: "Publish results to slowchop/rustia-bench-data"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure-rustia-current:
    name: Measure Rustia benchmark matrix
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'rustia')
    runs-on:
      - self-hosted
      - bench
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal

      - name: Use Rust stable
        run: rustup default stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify clean checkout
        run: |
          git diff --quiet --ignore-submodules --
          git diff --cached --quiet --ignore-submodules --

      - name: Run Rustia benchmark binary
        run: >
          cargo run -p script-bench-harness --release --
          --engines rustia
          --history bench/history/runs.jsonl
          --commit "$(git rev-parse --short HEAD)"

      - name: Refresh generated benchmark reports
        run: |
          cargo run -p script-bench-harness -- --refresh-results
          node bench/render-current-results.js
          node bench/render-claims.js

      - name: Check generated benchmark artifacts
        run: |
          node tools/check-benchmark-results.js
          node bench/render-current-results.js --check
          node bench/render-claims.js --check

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-rustia-current-results
          path: |
            bench/history/runs.jsonl
            bench/RESULTS.md
            bench/current-results.json
            bench/current-results.html
            bench/CLAIMS.md

      - name: Publish benchmark data
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          BENCH_DATA_TOKEN: ${{ secrets.BENCH_DATA_TOKEN }}
          BENCH_DATA_DIR: ${{ runner.temp }}/rustia-bench-data
        run: |
          if [ -z "$BENCH_DATA_TOKEN" ]; then
            echo "BENCH_DATA_TOKEN is required to publish benchmark data"
            exit 1
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf "$BENCH_DATA_DIR"
          git clone "https://x-access-token:${BENCH_DATA_TOKEN}@github.com/slowchop/rustia-bench-data.git" "$BENCH_DATA_DIR"

          node tools/merge-benchmark-history.js \
            --source bench/history/runs.jsonl \
            --destination "$BENCH_DATA_DIR/bench/history/runs.jsonl"

          (
            cd "$BENCH_DATA_DIR"
            cargo run --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" -p script-bench-harness -- --refresh-results \
              --history bench/history/runs.jsonl \
              --results bench/RESULTS.md \
              --latest-json bench/current-results.json
          )

          cp bench/render-current-results.js "$BENCH_DATA_DIR/bench/render-current-results.js"
          cp bench/render-claims.js "$BENCH_DATA_DIR/bench/render-claims.js"
          (
            cd "$BENCH_DATA_DIR"
            node bench/render-current-results.js
            node bench/render-claims.js
            rm bench/render-current-results.js bench/render-claims.js
          )
          node tools/render-benchmark-data-readme.js --data-dir "$BENCH_DATA_DIR"

          git -C "$BENCH_DATA_DIR" add \
            README.md \
            bench/history/runs.jsonl \
            bench/RESULTS.md \
            bench/current-results.json \
            bench/current-results.html \
            bench/CLAIMS.md
          if git -C "$BENCH_DATA_DIR" diff --cached --quiet; then
            echo "No benchmark data changes to publish"
            exit 0
          fi
          git -C "$BENCH_DATA_DIR" commit -m "Record Rustia benchmark results for $(git rev-parse --short HEAD)"
          git -C "$BENCH_DATA_DIR" push

  measure-full-current:
    name: Measure full benchmark matrix
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
    runs-on:
      - self-hosted
      - bench
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal

      - name: Use Rust stable
        run: rustup default stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify clean checkout
        run: |
          git diff --quiet --ignore-submodules --
          git diff --cached --quiet --ignore-submodules --

      - name: Run all-engines benchmark binary
        run: >
          cargo run -p script-bench-harness --release --features all-engines --
          --history bench/history/runs.jsonl
          --commit "$(git rev-parse --short HEAD)"

      - name: Run Lua 5.4 benchmark binary
        run: >
          cargo run -p script-bench-harness --release --no-default-features
          --features mlua-lua54 --
          --engines mlua-lua54
          --history bench/history/runs.jsonl
          --commit "$(git rev-parse --short HEAD)"

      - name: Refresh generated benchmark reports
        run: |
          cargo run -p script-bench-harness -- --refresh-results
          node bench/render-current-results.js
          node bench/render-claims.js

      - name: Check generated benchmark artifacts
        run: |
          node tools/check-benchmark-results.js
          node bench/render-current-results.js --check
          node bench/render-claims.js --check

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-full-current-results
          path: |
            bench/history/runs.jsonl
            bench/RESULTS.md
            bench/current-results.json
            bench/current-results.html
            bench/CLAIMS.md

      - name: Publish benchmark data
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          BENCH_DATA_TOKEN: ${{ secrets.BENCH_DATA_TOKEN }}
          BENCH_DATA_DIR: ${{ runner.temp }}/rustia-bench-data
        run: |
          if [ -z "$BENCH_DATA_TOKEN" ]; then
            echo "BENCH_DATA_TOKEN is required to publish benchmark data"
            exit 1
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf "$BENCH_DATA_DIR"
          git clone "https://x-access-token:${BENCH_DATA_TOKEN}@github.com/slowchop/rustia-bench-data.git" "$BENCH_DATA_DIR"

          node tools/merge-benchmark-history.js \
            --source bench/history/runs.jsonl \
            --destination "$BENCH_DATA_DIR/bench/history/runs.jsonl"

          (
            cd "$BENCH_DATA_DIR"
            cargo run --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" -p script-bench-harness -- --refresh-results \
              --history bench/history/runs.jsonl \
              --results bench/RESULTS.md \
              --latest-json bench/current-results.json
          )

          cp bench/render-current-results.js "$BENCH_DATA_DIR/bench/render-current-results.js"
          cp bench/render-claims.js "$BENCH_DATA_DIR/bench/render-claims.js"
          (
            cd "$BENCH_DATA_DIR"
            node bench/render-current-results.js
            node bench/render-claims.js
            rm bench/render-current-results.js bench/render-claims.js
          )
          node tools/render-benchmark-data-readme.js --data-dir "$BENCH_DATA_DIR"

          git -C "$BENCH_DATA_DIR" add \
            README.md \
            bench/history/runs.jsonl \
            bench/RESULTS.md \
            bench/current-results.json \
            bench/current-results.html \
            bench/CLAIMS.md
          if git -C "$BENCH_DATA_DIR" diff --cached --quiet; then
            echo "No benchmark data changes to publish"
            exit 0
          fi
          git -C "$BENCH_DATA_DIR" commit -m "Record full benchmark results for $(git rev-parse --short HEAD)"
          git -C "$BENCH_DATA_DIR" push
